services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: obras
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U obras -d obras"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
